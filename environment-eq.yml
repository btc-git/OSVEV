name: osvev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - av=18.1.0
  - ffmpeg=9.0.2=gpl*
  - pyqt6=6.11.0
  - qt6-main=6.11.2
  - numpy=2.4
  # OpenBLAS (BSD) instead of Intel MKL: smaller bundle, no proprietary MKL license in the executable.
  - libblas=*=*openblas
  - packaging
  - pip
  - pip:
      - opencv-python==4.13.0.90
      - pyinstaller==6.22.2
